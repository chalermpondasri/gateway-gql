version: '3'
services:
  service-graph:
    image: registry.gitlab.com/ucconnect.devs/doofin/doofin-graph:staging
    env_file:
      - ".env-graph.staging"
    restart: always
    networks:
      - app-network

  nginx-graph:
    image: nginx:stable-alpine
    volumes:
      - ./nginx-graph.conf:/etc/nginx/conf.d/default.conf
    container_name: graph
    depends_on:
      - service-graph
    networks:
      - app-network
    ports:
      - 8010:8080

networks:
  app-network:
    external: true